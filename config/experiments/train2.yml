# ============================================================
# OceanTracerPINN Training Configuration
# ============================================================

project:
  name: OceanTracerPINN
  experiment_id: "experiment2"
  notes: "New ResidualBlock Arch using SiLU rather than GELU layers."
  tracer: oxygen18
  seed: 4705749
  output_dir: outputs/oxygen18/experiment2
# ============================================================
# Dataset
# ============================================================
dataset:
  parquet_file: data/raw/AISIT_Database_1.0.0_uv.parquet
  target: Delta_O18_[permillle]
  date_format: "%Y-%m-%d %H:%M:%S"
  inputs:
    datetime: "ISO8601_Datetime"
    temperature: "Temperature_[cel]"
    salinity: "CTD_Salinity_[dimensionless]"
    depth: "Combined_Depth_[meters_below_surface]"
    latitude: "Latitude_[degree_north]"
    longitude: "Longitude_[degree_east]"
    u: "u"
    v: "v"


# ============================================================
# Model
# ============================================================

model:
  hidden_dim: 256
  n_blocks: 4
  cv_folds: 5
  holdout_frac: 0.15

# ============================================================
# Training
# ============================================================

training:
  epochs: 500
  batch_size: 512
  learning_rate: 0.5e-3
  weight_decay: 1.0e-5
  eta_min: 1.0e-6

# ============================================================
# Validation
# ============================================================
validation:
  mc_samples: 100

# ============================================================
# Physical Loss Weights
# ============================================================
loss:
  lambda_diap: 0.05
  lambda_smooth: 0.02
  lambda_advect: 0.05
